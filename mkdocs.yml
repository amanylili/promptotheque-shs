site_name: Promptothèque en sciences humaines et sociales
site_description: Prompts prêts à l'emploi pour la linguistique de corpus, la lexicométrie, la sociolinguistique et la didactique du FLE
site_author: Promptothèque SHS
site_url: https://amanylili.github.io/promptotheque-shs/
repo_url: https://github.com/amanylili/promptotheque-shs
repo_name: promptotheque-shs
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: fr
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search:
      lang: fr

nav:
  - Accueil: index.md
  - Bien utiliser les prompts: bonnes-pratiques.md
  - Linguistique de corpus et lexicométrie:
      - linguistique-de-corpus/index.md
      - Préparer et explorer le corpus:
          - Constituer un corpus: linguistique-de-corpus/constitution-corpus.md
          - Nettoyer un corpus: linguistique-de-corpus/nettoyage-corpus.md
          - Pseudonymiser un corpus: linguistique-de-corpus/pseudonymisation-corpus.md
          - Annoter (lemmes, catégories): linguistique-de-corpus/annotation-morphosyntaxique.md
          - Concordances (KWIC): linguistique-de-corpus/concordances-kwic.md
          - Segmenter un corpus: linguistique-de-corpus/segmentation.md
          - Construire un concordancier: linguistique-de-corpus/concordancier.md
          - Interroger un corpus (CQL et SQL): linguistique-de-corpus/requetes-cql-sql.md
      - Analyser le corpus (lexicométrie):
          - Comptage de fréquences: lexicometrie/comptage-frequences.md
          - Calcul des spécificités: lexicometrie/calcul-specificites.md
          - AFC sur tableau lexical: lexicometrie/afc-tableau-lexical.md
          - Cooccurrences: lexicometrie/cooccurrences.md
          - Classification (méthode Reinert): lexicometrie/classification-reinert.md
          - Segments répétés: lexicometrie/segments-repetes.md
          - Motifs textuels: lexicometrie/motifs-textuels.md
          - Analyse en composantes principales (ACP): lexicometrie/acp.md
          - Classification automatique (CAH, k-means): lexicometrie/classification-automatique.md
          - Choisir et rapporter une statistique: lexicometrie/statistiques-corpus.md
      - TAL et apprentissage automatique:
          - Repérer les entités nommées: linguistique-de-corpus/entites-nommees.md
          - Aligner un corpus parallèle: linguistique-de-corpus/alignement.md
          - Apprentissage profond appliqué au texte: linguistique-de-corpus/apprentissage-profond.md
  - Sociolinguistique:
      - sociolinguistique/index.md
      - Enquêter:
          - Entretien sociolinguistique (Labov): sociolinguistique/entretien-labovien.md
          - Enquête rapide et anonyme: sociolinguistique/enquete-rapide-anonyme.md
          - Guide d'entretien (représentations): sociolinguistique/guide-entretien.md
          - Transcription de l'oral: sociolinguistique/transcription-oral.md
      - Décrire et mesurer la variation:
          - Définir et coder une variable: sociolinguistique/variable-sociolinguistique.md
          - Analyse quantitative de la variation: sociolinguistique/analyse-variationniste.md
      - Discours, représentations, plurilinguisme:
          - Analyser un récit oral (Labov et Waletzky): sociolinguistique/recit-experience.md
          - Insécurité linguistique et évaluations subjectives: sociolinguistique/insecurite-linguistique.md
          - Alternance codique: sociolinguistique/alternance-codique.md
  - Didactique du FLE:
      - didactique-fle/index.md
      - Concevoir:
          - Scénario actionnel: didactique-fle/scenario-actionnel.md
          - FOS et FOU: didactique-fle/fos-fou.md
      - Activités langagières:
          - Document audio ou vidéo: didactique-fle/comprehension-orale.md
          - Adapter un texte au CECRL: didactique-fle/adapter-texte-cecrl.md
          - Interaction et production orales: didactique-fle/interaction-orale.md
          - Médiation: didactique-fle/mediation.md
      - Ressources langagières:
          - Séquence sur corpus: didactique-fle/sequence-sur-corpus.md
          - Phonétique corrective: didactique-fle/phonetique-corrective.md
          - Approches plurielles et interculturel: didactique-fle/approches-plurielles.md
      - Évaluer et analyser:
          - Évaluer avec le CECR: didactique-fle/evaluation-cecr.md
          - Corriger une production écrite: didactique-fle/correction-production-ecrite.md
          - Analyser l'interlangue: didactique-fle/interlangue.md
  - Recherche documentaire:
      - recherche-documentaire/index.md
      - Recherche Google avancée: recherche-documentaire/recherche-google-avancee.md
  - Visualisation:
      - visualisation/index.md
      - Carte mentale (Mermaid): visualisation/carte-mentale.md
  - Contribuer: contribuer.md
